<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مغامرة سكراتش 🐱 | لعبة أركيد</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
  * { box-sizing: border-box; margin:0; padding:0; font-family: 'Cairo', sans-serif; }
  body {
    background: #0f0c29;
    background: linear-gradient(180deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 16px; color: white;
  }
  #game {
    width: 100%; max-width: 600px;
    background: #1a1a3a;
    border: 4px solid #00ffcc;
    border-radius: 20px;
    box-shadow: 0 0 20px #00ffcc, 0 0 60px #ff00de inset;
    overflow:hidden;
    text-align:center;
  }
  .header {
    background: #000; padding: 12px;
    display:flex; justify-content:space-between; align-items:center;
    border-bottom: 3px solid #00ffcc;
    font-weight:900;
  }
  .badge {
    background:#ffde59; color:#222; padding:4px 14px; border-radius:20px;
    font-size:18px; border:2px solid #fff;
  }
  .screen { padding: 26px 20px 30px; display:none; }
  .screen.active { display:block; animation: pop .35s ease; }
  @keyframes pop { from{transform:scale(.9); opacity:0} to{transform:scale(1); opacity:1} }
  h1 { font-size: 32px; margin: 10px 0; color:#ffde59; text-shadow: 3px 3px 0 #ff00de; }
  h2 { font-size:24px; margin-bottom:12px; color:#00ffcc; }
  p { font-size:19px; line-height:1.8; }
  .cat-big { font-size: 80px; animation: bounce 1.2s infinite alternate; display:inline-block; }
  @keyframes bounce { from{transform:translateY(0)} to{transform:translateY(-15px) rotate(-5deg)} }
  .btn {
    background: linear-gradient(180deg,#00ffcc,#00aa88);
    border:none; border-bottom:6px solid #007766;
    color:#00261f; font-size:22px; font-weight:900;
    padding:14px 28px; border-radius:15px; cursor:pointer; margin-top:18px;
    width:100%; transition:.15s;
  }
  .btn:active { transform:translateY(4px); border-bottom-width:2px; }
  .btn-pink {
    background: linear-gradient(180deg,#ff7ad9,#ff00de);
    border-bottom-color:#990087; color:white;
    text-shadow:1px 1px 0 #000;
  }
  .progress-wrap { background:#000; border-radius:20px; height:16px; margin:12px 0; overflow:hidden; border:2px solid #fff; }
  #progress { background:linear-gradient(90deg,#ffde59,#ff00de); height:100%; width:0%; transition:.4s; }
  #timer-bar-wrap { background:#333; height:10px; border-radius:10px; overflow:hidden; margin:10px 0 18px; }
  #timer-bar { background:#00ffcc; height:100%; width:100%; transition: width 1s linear; }
  .q-text { background:#fff; color:#222; font-size:22px; font-weight:700; border-radius:15px; padding:16px; margin:10px 0 16px; border:4px solid #ffde59; }
  .options { display:grid; gap:12px; }
  .opt {
    background:#2d2d6a; border:3px solid #00ffcc; color:white;
    font-size:19px; font-weight:700; padding:13px; border-radius:14px; cursor:pointer; transition:.15s;
  }
  .opt:hover { background:#3d3d8a; transform:scale(1.02); }
  .opt.correct { background:#00c853 !important; border-color:#fff; animation: win .5s; }
  .opt.wrong { background:#d50000 !important; border-color:#fff; animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  @keyframes win { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
  #feedback { font-size:22px; font-weight:900; min-height:36px; margin-top:14px; }
  .good { color:#00ff88; } .bad { color:#ff5252; }
  .stars { font-size:50px; margin:10px 0; }
  .score-big { font-size:60px; font-weight:900; color:#ffde59; text-shadow:2px 2px 0 #000; }
  .hearts { font-size:20px; }
  .footer { font-size:14px; opacity:.7; padding:10px; background:#000; }
</style>
</head>
<body>
<div id="game">
  <div class="header">
    <div class="badge">⭐ النقاط: <span id="score">0</span></div>
    <div>🐱 سكراتش أركيد</div>
    <div class="badge hearts">❤️ <span id="level">1</span>/10</div>
  </div>

  <!-- شاشة البداية -->
  <div id="screen-start" class="screen active">
    <div class="cat-big">🐱</div>
    <h1>مغامرة سكراتش!</h1>
    <p>أهلاً يا بطل! 👋<br>هل أنت مستعد لتصبح مبرمجاً صغيراً؟<br>جاوب على <b>10 أسئلة</b> عن سكراتش واجمع النجوم!</p>
    <p style="margin-top:10px">🎮 كل إجابة صحيحة = <b>10 نقاط</b></p>
    <button class="btn btn-pink" onclick="startGame()">▶️ ابدأ اللعب</button>
  </div>

  <!-- شاشة السؤال -->
  <div id="screen-quiz" class="screen">
    <div class="progress-wrap"><div id="progress"></div></div>
    <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
    <div class="q-text" id="question"></div>
    <div class="options" id="options"></div>
    <div id="feedback"></div>
  </div>

  <!-- شاشة النهاية -->
  <div id="screen-end" class="screen">
    <div class="cat-big" id="end-cat">🏆</div>
    <h1>انتهت اللعبة!</h1>
    <div class="stars" id="stars">⭐⭐⭐</div>
    <div class="score-big"><span id="final-score">0</span> / 100</div>
    <p id="end-message" style="margin-top:12px"></p>
    <button class="btn btn-pink" onclick="startGame()">🔁 العب مرة أخرى</button>
  </div>

  <div class="footer">صُنعت بحب للأبطال الصغار ❤️ - سكراتش للأطفال 9 سنوات</div>
</div>

<script>
const questions = [
  {
    q: "ما هو سكراتش؟ 🤔",
    a: ["لغة برمجة بالمكعبات الملونة لصنع الألعاب والقصص", "نوع من الحلوى", "لعبة كرة قدم", "قلم تلوين"],
    c: 0
  },
  {
    q: "ماذا يفعل العَلَم الأخضر 🚩 في سكراتش؟",
    a: ["يوقف اللعبة", "يبدأ اللعبة والبرنامج", "يحذف القطة", "يغير لون الخلفية"],
    c: 1
  },
  {
    q: "ماذا نسمي الشخصية مثل القطة في سكراتش؟ 🐱",
    a: ["كائن (Sprite)", "مسرح (Stage)", "مكعب ثلج", "فيلم"],
    c: 0
  },
  {
    q: "أين تقف الكائنات وتتحرك في سكراتش؟ 🎭",
    a: ["في المطبخ", "على المسرح (Stage)", "في الحقيبة", "في السماء فقط"],
    c: 1
  },
  {
    q: "أي مكعب يجعل القطة تتحرك 10 خطوات؟ 🏃",
    a: ["قول مرحباً!", "تحرك 10 خطوات", "أصدر صوت مواء", "توقف"],
    c: 1
  },
  {
    q: "ما لون مكعبات الحركة (Motion)؟ 💙",
    a: ["أزرق", "أخضر", "أحمر", "أسود"],
    c: 0
  },
  {
    q: "أي مكعب نستخدمه لتكرار شيء كثيراً؟ 🔁",
    a: ["كرر (Repeat)", "احذف", "نم", "اختبئ"],
    c: 0
  },
  {
    q: "كيف نجعل القطة تقول: مرحباً! 💬",
    a: ["مكعب (قل مرحباً!) من المظهر", "نصرخ في الكمبيوتر", "نرسمها", "نطفي الجهاز"],
    c: 0
  },
  {
    q: "الزر الأحمر 🛑 في سكراتش ماذا يفعل؟",
    a: ["يبدأ الغناء", "يوقف كل شيء", "يكبر القطة", "يصورنا"],
    c: 1
  },
  {
    q: "ماذا نحتاج لنصنع لعبة تجمع النقاط؟ 🌟",
    a: ["متغير (Variable) لحفظ النقاط", "شطيرة", "سيارة حقيقية", "مطر"],
    c: 0
  }
];

let idx = 0, score = 0, timer = null, timeLeft = 20;

function playSound(ok) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = ok ? 600 : 200;
    if(ok){ o.frequency.setValueAtTime(523, ctx.currentTime); o.frequency.setValueAtTime(659, ctx.currentTime+0.1); o.frequency.setValueAtTime(784, ctx.currentTime+0.2); }
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (ok?0.4:0.3));
    o.stop(ctx.currentTime + 0.4);
  } catch(e){}
}

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startGame(){
  idx = 0; score = 0;
  document.getElementById('score').textContent = score;
  show('screen-quiz');
  showQuestion();
}

function showQuestion(){
  clearInterval(timer);
  timeLeft = 20;
  const q = questions[idx];
  document.getElementById('level').textContent = (idx+1);
  document.getElementById('progress').style.width = ((idx)/questions.length*100) + '%';
  document.getElementById('question').textContent = 'السؤال ' + (idx+1) + ': ' + q.q;
  document.getElementById('feedback').textContent = '';
  const box = document.getElementById('options');
  box.innerHTML = '';
  q.a.forEach((txt,i)=>{
    const b = document.createElement('button');
    b.className='opt'; b.textContent = txt;
    b.onclick = ()=>answer(i,b);
    box.appendChild(b);
  });
  updateTimerBar();
  timer = setInterval(()=>{
    timeLeft--;
    updateTimerBar();
    if(timeLeft<=0){ clearInterval(timer); answer(-1,null); }
  },1000);
}

function updateTimerBar(){
  document.getElementById('timer-bar').style.width = (timeLeft/20*100)+'%';
  document.getElementById('timer-bar').style.background = timeLeft<=5 ? '#ff5252' : '#00ffcc';
}

function answer(i, btn){
  clearInterval(timer);
  const q = questions[idx];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b=>b.style.pointerEvents='none');
  const fb = document.getElementById('feedback');
  if(i===q.c){
    score+=10;
    document.getElementById('score').textContent = score;
    if(btn) btn.classList.add('correct');
    fb.textContent = '🎉 برافو! إجابة صحيحة! +10'; fb.className='good';
    playSound(true);
  } else {
    if(btn) btn.classList.add('wrong');
    if(btns[q.c]) btns[q.c].classList.add('correct');
    fb.textContent = i===-1 ? '⏰ انتهى الوقت! الإجابة الصحيحة بالأخضر' : '😅 حاول مرة أخرى! الإجابة الصحيحة بالأخضر';
    fb.className='bad';
    playSound(false);
  }
  document.getElementById('progress').style.width = ((idx+1)/questions.length*100)+'%';
  setTimeout(()=>{
    idx++;
    if(idx < questions.length) showQuestion();
    else endGame();
  },1500);
}

function endGame(){
  show('screen-end');
  document.getElementById('final-score').textContent = score;
  let stars='⭐', msg='', cat='🏆';
  if(score===100){ stars='⭐⭐⭐⭐⭐'; msg='مذهل! أنت نجم سكراتش الحقيقي! 🌟🌟🌟 استمر يا عبقري!'; cat='👑'; }
  else if(score>=80){ stars='⭐⭐⭐⭐'; msg='رائع جداً! أنت مبرمج شاطر! 💪'; cat='🏆'; }
  else if(score>=50){ stars='⭐⭐⭐'; msg='أحسنت! أنت تتعلم بسرعة! استمر! 😊'; cat='🐱'; }
  else if(score>=30){ stars='⭐⭐'; msg='بداية جميلة! العب مرة أخرى لتصبح أفضل! 🚀'; cat='🐱'; }
  else { stars='⭐'; msg='لا تزعل! كل الأبطال يتدربون! حاول مرة أخرى! ❤️'; cat='💪'; }
  document.getElementById('stars').textContent = stars;
  document.getElementById('end-message').textContent = msg;
  document.getElementById('end-cat').textContent = cat;
  playSound(score>=50);
}
</script>
</body>
</html>
